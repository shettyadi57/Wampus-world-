<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wampus World</title>
  <meta name="description" content="Symbolic AI-driven open-world driving game — Wampus World" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #14161A; overflow: hidden; }
  </style>
  <link rel="stylesheet" href="/styles/theme.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Three.js renders into this canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Full-screen hazard feedback vignette overlay -->
  <div id="hazard-vignette"></div>

  <!-- UI Overlay mount root -->
  <div id="ui-overlay" role="presentation"></div>

  <!-- Boot: type="module" enables ES-module imports across the whole client -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
